<svg class="button" height="100" width="100"><circle class="innerCircle" cx="50%" cy="50%" r="25%" fill="none" stroke="#fff" stroke-width="5%"><animate attributeType="SVG" attributeName="r" begin="0s" dur="1.5s" repeatCount="indefinite" from="5%" to="25%"/><animate attributeType="CSS" attributeName="stroke-width" begin="0s" dur="1.5s" repeatCount="indefinite" from="3%" to="0%"/><animate attributeType="CSS" attributeName="opacity" begin="0s" dur="1.5s" repeatCount="indefinite" from="1" to="0"/></circle></svg>